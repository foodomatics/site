<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foodomatics</title>
<meta name="description" content="Foodomatics Corp. Fresh food needs a standard, not a store.">
<meta name="robots" content="index, nofollow">
<meta name="theme-color" content="#120b08">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root{
    --ink:#fbf3e8;
    --dim:rgba(251,243,232,.68);
    --ground:#120b08;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow:hidden;
  }
  canvas#tea{position:fixed;inset:0;width:100%;height:100%;display:block}
  .fallback{
    position:fixed;inset:0;display:none;
    background:
      radial-gradient(70% 55% at 35% 45%, #e9c79a 0%, rgba(233,199,154,0) 60%),
      radial-gradient(60% 50% at 72% 60%, #8a4b22 0%, rgba(138,75,34,0) 65%),
      linear-gradient(180deg,#5a2e16 0%, #1a0f0a 100%);
  }
  body.nogl .fallback{display:block}
  body.nogl canvas#tea{display:none}

  main{
    position:relative;height:100%;
    display:grid;place-items:center;
    padding:0 16px;
    text-align:center;
  }
  .mark{
    display:grid;gap:18px;justify-items:center;
    mix-blend-mode:normal;
  }
  h1{
    margin:0;
    font-family:"Barlow Semi Condensed","IBM Plex Sans",sans-serif;
    font-weight:600;
    font-size:clamp(3rem, 12vw, 11rem);
    line-height:.9;
    letter-spacing:.14em;
    text-indent:.14em;
    text-wrap:balance;
    text-shadow:0 1px 0 rgba(18,11,8,.25), 0 24px 60px rgba(18,11,8,.35);
  }
  .line{
    margin:0;
    font-size:clamp(.85rem, 1.4vw, 1.05rem);
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--dim);
  }
  footer{
    position:fixed;left:0;right:0;bottom:0;
    padding:0 28px calc(22px + env(safe-area-inset-bottom,0px));
    display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
    font-size:.78rem;line-height:1.55;color:var(--dim);
  }
  footer a{color:var(--ink);text-decoration:none;font-weight:500}
  footer a:hover{text-decoration:underline}
  .legal p{margin:0}
  .links a{display:inline-flex;align-items:center;gap:8px;letter-spacing:.12em;font-size:.72rem;text-transform:uppercase}
  .links svg{width:18px;height:18px;fill:var(--ink)}
  @media (max-width:600px){
    footer{flex-direction:column;align-items:flex-start;padding-inline:16px}
    h1{letter-spacing:.1em;text-indent:.1em}
  }
</style>
</head>
<body>
<canvas id="tea" aria-hidden="true"></canvas>
<div class="fallback" aria-hidden="true"></div>

<main>
  <div class="mark">
    <h1>FOODOMATICS</h1>
    <p class="line">Fresh food needs a standard, not a store</p>
  </div>
</main>

<footer>
  <div class="legal">
    <p><a href="privacy.html">Privacy</a></p>
    <p>© 2026 Foodomatics Corp. · BOBAFY is a trademark of Foodomatics Corp.</p>
  </div>
  <div class="links">
    <a href="https://www.linkedin.com/company/bobafy" rel="me" aria-label="Foodomatics on LinkedIn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z"/></svg>
      LinkedIn
    </a>
  </div>
</footer>

<script>
/* Tea into milk: a domain-warped noise field rendered as a marbling of
   three liquids (tea, milk, pearl-dark), drifting slowly. No textures,
   no libraries. Runs at a reduced internal resolution for cool GPUs. */
(function(){
  const canvas = document.getElementById('tea');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const gl = canvas.getContext('webgl', {antialias:false, alpha:false, powerPreference:'low-power'});
  if(!gl){ document.body.classList.add('nogl'); return; }

  const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
  const fs = `
  precision mediump float;
  uniform vec2 u_res; uniform float u_t; uniform vec2 u_mouse;

  // hash + value noise (cheap, smooth enough for liquid)
  float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
  float noise(vec2 p){
    vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
    float a=hash(i), b=hash(i+vec2(1,0)), c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
    return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
  }
  float fbm(vec2 p){
    float v=0., a=.5; mat2 r=mat2(.8,.6,-.6,.8);
    for(int i=0;i<5;i++){ v+=a*noise(p); p=r*p*2.03+vec2(1.7,9.2); a*=.5; }
    return v;
  }
  void main(){
    vec2 uv = (gl_FragCoord.xy - .5*u_res) / min(u_res.x,u_res.y);
    float t = u_t*.045;
    // the pour comes in from the upper right, pulled a little by the cursor
    vec2 pull = (u_mouse-.5)*.25;
    vec2 p = uv*1.6 + pull;

    // two layers of domain warping: tea swirling into milk
    vec2 q = vec2(fbm(p + vec2(0.0,0.0) + t), fbm(p + vec2(5.2,1.3) - t*.8));
    vec2 r = vec2(fbm(p + 4.0*q + vec2(1.7,9.2) + t*.6), fbm(p + 4.0*q + vec2(8.3,2.8) - t*.4));
    float f = fbm(p + 3.0*r);

    // palette: pearl-dark, tea, milk-tea, milk
    vec3 pearl = vec3(0.07,0.043,0.031);
    vec3 tea   = vec3(0.42,0.20,0.09);
    vec3 latte = vec3(0.84,0.62,0.40);
    vec3 milk  = vec3(0.98,0.93,0.84);

    vec3 col = mix(pearl, tea, smoothstep(.14,.48,f));
    col = mix(col, latte, smoothstep(.40,.64,f) * (0.6+0.4*q.y));
    col = mix(col, milk,  smoothstep(.60,.84,f) * (0.5+0.5*r.x));

    // a soft light from the upper right, like the window over the counter
    float light = smoothstep(1.2,-.2,length(uv - vec2(.75,.45)));
    col += vec3(.10,.07,.03)*light;

    // vignette so the wordmark reads
    float v = smoothstep(1.35,.35,length(uv*vec2(.8,1.1)));
    col *= mix(.72,1.0,v);

    gl_FragColor = vec4(col,1.);
  }`;

  function sh(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){ document.body.classList.add('nogl'); return; }
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const uRes = gl.getUniformLocation(prog,'u_res'), uT = gl.getUniformLocation(prog,'u_t'), uM = gl.getUniformLocation(prog,'u_mouse');

  let mouse=[.5,.5], target=[.5,.5];
  addEventListener('pointermove', e=>{ target=[e.clientX/innerWidth, 1-e.clientY/innerHeight]; }, {passive:true});

  function resize(){
    const scale = Math.min(devicePixelRatio||1, 1.5) * 0.6;   // internal resolution: cheap, still smooth
    canvas.width  = Math.max(2, Math.floor(innerWidth*scale));
    canvas.height = Math.max(2, Math.floor(innerHeight*scale));
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
  }
  addEventListener('resize', resize); resize();

  const t0 = performance.now();
  function frame(now){
    mouse[0]+= (target[0]-mouse[0])*.04; mouse[1]+= (target[1]-mouse[1])*.04;
    gl.uniform1f(uT, (now-t0)/1000);
    gl.uniform2f(uM, mouse[0], mouse[1]);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    if(!reduce && !document.hidden) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && !reduce) requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
